<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вход — Акватория</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="pages.css">

</head>

<body>

<div class="auth-page">

    <div class="auth-box">

        <!-- Кнопка "Назад" -->
        <button type="button" class="auth-back" onclick="goBack()" aria-label="Назад">
            <span class="auth-back-arrow">←</span>
            <span>Назад</span>
        </button>

        <a href="index.html" class="logo auth-logo">АКВАТОРИЯ</a>

        <h1>Вход</h1>

        <p>Войдите в личный кабинет</p>

        <form id="login-form">

            <input type="email" id="login-email" placeholder="E-mail" required>
            <input type="password" id="login-password" placeholder="Пароль" required>

            <button class="btn btn-dark" type="submit">Войти</button>

        </form>

        <p class="auth-bottom">
            Нет аккаунта?
            <a href="register.html">Зарегистрироваться</a>
        </p>

    </div>

</div>


<!-- Подключаем Supabase (именно в этом порядке!) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script src="main.js"></script>

</body>
</html>
